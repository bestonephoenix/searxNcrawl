# Publishes every upstream release as a container image to GHCR.
#
# This workflow deliberately does NOT touch git refs: the Actions token
# (GITHUB_TOKEN) is a GitHub App installation token without the `workflows`
# permission, so GitHub rejects any push carrying an upstream change to
# .github/workflows/* ("refusing to allow a GitHub App to create or update
# workflow ... without workflows permission"), and the same happens to tags that
# point at such commits. Syncing the branch and mirroring the tags is therefore
# done by ~/.hermes/scripts/searxncrawl-sync.sh, which holds a token that can.
#
# This workflow only reads and builds:
#   * resolves the release tag (input, else newest upstream release)
#   * skips cleanly when the fork has no such tag yet or the release exists
#   * builds the Dockerfile at that tag and pushes ghcr.io/<owner>/searxncrawl
#   * publishes the mirrored GitHub release with upstream's notes
name: GHCR release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (empty = newest upstream release)"
        required: false
        type: string
      force:
        description: "Rebuild even if the release already exists"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [searxncrawl-release]
  schedule:
    # Safety net only: publishes if a release tag is already mirrored here but
    # the image is missing (e.g. the dispatch after a sync was lost).
    - cron: "23 */6 * * *"

permissions:
  contents: write
  packages: write

concurrency:
  group: ghcr-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: DasDigitaleMomentum/searxNcrawl
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/searxncrawl

jobs:
  publish:
    name: build & publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve the release tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          tag="${REQUESTED_TAG:-}"
          if [ -z "$tag" ]; then
            tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          fi
          echo "release tag: ${tag}"

          # The tag has to be mirrored into this repo first (done by the sync
          # script). Building from a tag that only exists upstream would produce
          # a release object pointing at nothing here.
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice::Tag ${tag} is not mirrored into ${GITHUB_REPOSITORY} yet - nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${FORCE}" = "true" ]; then
            publish=true
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            publish=false
            echo "::notice::Release ${tag} already exists - nothing to do (use force to rebuild)"
          else
            publish=true
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Check out the release tag
        if: steps.resolve.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 1

      - name: Set up Buildx
        if: steps.resolve.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.resolve.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        if: steps.resolve.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push image
        if: steps.resolve.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the mirrored GitHub release
        if: steps.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          upstream_body="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${TAG}" --jq .body 2>/dev/null || true)"

          {
            echo "Mirror of [\`${UPSTREAM_REPO}@${TAG}\`](https://github.com/${UPSTREAM_REPO}/releases/tag/${TAG})."
            echo
            echo "Image: \`${IMAGE_NAME}:${TAG#v}\`"
            echo
            echo '```'
            echo "docker pull ${IMAGE_NAME}:${TAG#v}"
            echo '```'
            echo
            echo "---"
            echo
            printf '%s\n' "${upstream_body}"
          } > notes.md

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file notes.md
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" --notes-file notes.md --verify-tag
          fi
